name: Offline source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  layer-angle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - name: Verify signed layer angles without simulation assets
        run: python -m unittest discover -s revotron_cube_rl -p 'test_cube_state.py'
